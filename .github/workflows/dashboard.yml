name: Update Kindle dashboard

on:
  schedule:
    - cron: "50 0-16 * * *"  # hourly backup at :50, 6:20am-10:20pm IST (the Kindle also asks for updates itself)
  workflow_dispatch: {}      # lets you click "Run workflow" to refresh now

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow==11.0.0

      - name: Restore overdue history (for Rescue mode trend)
        uses: actions/cache/restore@v4
        with:
          path: history
          key: overdue-history-${{ github.run_id }}
          restore-keys: overdue-history-

      - name: Render dashboard
        env:
          TICKTICK_TOKEN: ${{ secrets.TICKTICK_TOKEN }}
          DASH_PATH: ${{ secrets.DASH_PATH }}
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          TZ_NAME: ${{ vars.TZ_NAME || 'Asia/Kolkata' }}
          LISTS: ${{ vars.LISTS }}
          WEEK: ${{ vars.WEEK || 'calendar' }}
          REFRESH_SECONDS: ${{ vars.REFRESH_SECONDS || '3600' }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS || '22-6' }}
        run: python render.py

      - name: Save overdue history
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: history
          key: overdue-history-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

      - id: deployment
        uses: actions/deploy-pages@v4
